id          = "com.borisfx.genai"
name        = "GenAI Emulator"
version     = "1.0.1"
author      = "Boris FX"
description = """
Test a video-generation workflow without paying for AI generation. Submit a
clip, follow its progress, and receive the original clip back after a simulated
delay. This is a testing tool for developers; it does not generate new imagery.
"""
# Needs the shared `genai` task engine that ships with Silhouette's scripts.
silhouette  = ">=2027"

python_requires = []

[contributes]
nodes = ["com.borisfx.silhouette.genai"]
