id          = "com.borisfx.colorpatch"
name        = "Color Patch"
version     = "0.1.3"
author      = "Boris FX"
description = """
Cover tracking markers, blemishes, and small objects with a patch that blends
colors sampled from the surrounding image. Use four corners for a quick patch,
or follow a roto shape for more control over its outline.
"""
silhouette      = ">=2027"
python_requires = ["numpy"]

[contributes]
nodes = ["ColorPatch"]
