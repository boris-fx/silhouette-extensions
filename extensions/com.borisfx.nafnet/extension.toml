id          = "com.borisfx.nafnet"
name        = "NAFNet Restore"
version     = "1.1.1"
author      = "Boris FX"
description = """
Reduce image blur with NAFNet Restore. The included GoPro deblurring model
processes each frame independently and can be downloaded from the node when
first needed. Uses NVIDIA CUDA where available, or the CPU, including on Mac.
"""
silhouette      = ">=2027"
python_requires = ["torch", "numpy"]

[contributes]
nodes = ["com.borisfx.silhouette.nafnet"]
