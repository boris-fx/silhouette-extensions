id          = "com.borisfx.testmenu"
name        = "Test Menu"
version     = "1.0.1"
author      = "Boris FX"
description = """
Add a Test menu with Say Hello and Say Goodbye, plus a command in the node-graph
context menu. The commands print to the Script Console so you can check that
they ran. A developer sample for trying custom menu commands.
"""
silhouette  = ">=2027"

[contributes]
actions = ["TestSayHello", "TestSayGoodbye", "TestTreesAction"]
