id          = "com.borisfx.colorchips"
name        = "Color Chips"
version     = "0.1.1"
author      = "Boris FX"
description = """
Sample up to four areas of an image and display their colors as labeled swatch
cards. Move the sample points by hand or attach them to tracking, and compare
color names and values while you work.
"""
silhouette      = ">=2027"
python_requires = ["numpy"]

[contributes]
nodes = ["ColorChips"]
